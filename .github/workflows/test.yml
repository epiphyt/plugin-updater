name: Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  phpcs:
    name: Coding standard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      # the standard is registered by a Composer plugin that runs after the
      # standard itself is extracted, so a second pass is required
      - name: Register coding standards
        run: composer install --no-interaction --no-progress
      - run: composer phpcs

  phpstan:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - run: composer phpstan

  phpunit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - run: composer phpunit

  e2e:
    name: End-to-end (${{ matrix.matrix }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        matrix: [single, multisite]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playground download
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: playground-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: playground-${{ runner.os }}-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run the end-to-end suite
        run: php tests/e2e/run.php --matrix=${{ matrix.matrix }}

  e2e-scenarios:
    name: End-to-end failure scenarios
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - invalid-key
          - expired
          - activation-limit-reached
          - server-500
          - flat-package
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache Playground download
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: playground-${{ runner.os }}-${{ hashFiles('.github/workflows/test.yml') }}
          restore-keys: playground-${{ runner.os }}-
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run the scenario
        run: php tests/e2e/run.php --matrix=single --scenario=${{ matrix.scenario }}
